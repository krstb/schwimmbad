    <script>
      // Service Worker Registrierung
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .catch(err => console.log('SW Fehler:', err));
        });
      }

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');       

        /* Fix für PWA-Ränder und den blauen Balken */
        html {
            background-color: #000000 !important;
            overscroll-behavior-y: none;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            color: #334155;
            min-height: 100vh;
            padding: 1rem;
            background-image: repeating-linear-gradient(135deg, #a8d5e5, #a8d5e5 5px, #bde0ef 5px, #bde0ef 10px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

             right: -2.5rem;
        }

</head>
<body>
    <div class="w-full max-w-sm mx-auto p-4 bg-white rounded-2xl shadow-xl border-2 border-gray-200 space-y-2">
        
        <h1 class="text-xl font-bold text-center text-gray-800">Robert's Eintrittsrechner</h1>

        <div class="bg-gray-50 border border-gray-200 p-2 rounded-lg space-y-2">
            <div>
                <label for="thermeSelect" class="block text-xs font-bold text-gray-500 uppercase mb-1">BAD / THERME AUSWÄHLEN</label>
                <div class="flex items-center gap-2">
                    <select id="thermeSelect" class="flex-1 h-9 py-1 px-2 border border-gray-300 rounded-lg text-base text-gray-700 font-medium">
                        <option value="badWoerishofen" selected>Therme Bad Wörishofen</option>
                        <option value="kristalltherme">Kristall-Therme Schwangau</option>
                        <option value="titania">Titania Neusäß</option>
                        <option value="bobingen">Saunapark Bobingen</option>
                        <option value="musterbad1">Musterbad 1</option>
                        <option value="musterbad2">Musterbad 2</option>
                        <option value="musterbad3">Musterbad 3</option>
                    </select>

                    <button type="button" id="infoButton" class="h-9 w-9 flex items-center justify-center text-gray-500 hover:text-blue-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">
                        <span class="inline-flex items-center justify-center w-5 h-5 rounded-full border border-current text-xs font-bold leading-none font-serif italic">i</span>
                    </button>
                </div>
            </div>
            <div id="nextOpeningHoursDisplay" class="text-center text-sm p-2 bg-blue-100 text-blue-800 rounded-lg font-medium w-full"></div>
        </div>

        <div class="bg-gray-50 border border-gray-200 p-2 rounded-lg space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label for="entryTime" class="block text-xs font-bold text-gray-500 uppercase mb-1">Beginn des Besuches</label>
                    <input type="time" id="entryTime" class="w-full h-9 py-1 px-2 border border-gray-300 rounded-lg text-base text-gray-700 font-medium text-center">
                </div>
                <div>
                    <label for="departureTime" class="relative block text-xs font-bold text-gray-500 uppercase mb-1">Abreise bis <span id="tomorrowLabel" class="hidden absolute -top-1.5 px-2 py-0.5 bg-blue-600 text-white text-xs font-bold rounded-full border border-blue-800">Morgen</span></label>
                    <input type="time" id="departureTime" class="w-full h-9 py-1 px-2 border border-gray-300 rounded-lg text-base text-gray-700 font-medium text-center">
                </div>
            </div>
            <div>
                <label for="durationHours" class="block text-xs font-bold text-gray-500 uppercase mb-1">Aufenthalt (h/min)</label>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="durationHours" min="0" max="12" placeholder="Stunden" class="w-full h-9 py-1 px-2 border border-gray-300 rounded-lg text-base text-gray-700 font-medium text-center">
                    <input type="number" id="durationMinutes" min="0" max="59" step="5" placeholder="Minuten" class="w-full h-9 py-1 px-2 border border-gray-300 rounded-lg text-base text-gray-700 font-medium text-center">
                </div>
            </div>
        </div>

        <div id="results" class="space-y-2">
            <div id="recommendationBox" class="p-2 rounded-lg text-white font-medium text-center transition-colors duration-500 min-h-[4rem] flex flex-col justify-center">
                <div id="targetDateBadge" class="hidden inline-block mx-auto mb-1 px-2 py-0.5 bg-black bg-opacity-25 rounded-md text-xs font-bold tracking-wide"></div>
                <p id="recommendationText" class="text-lg font-bold">Warte auf Eingabe</p>
                <p id="savingsText" class="mt-1 text-xs">&nbsp;</p>
            </div>

            <div class="grid grid-cols-2 gap-2 text-center">
                <div class="p-1 bg-red-100 border border-red-200 rounded-lg">
                    <p class="text-xs text-red-700 font-bold">KOSTEN</p>
                    <p class="text-base font-bold text-red-800"><span id="calculatedCost"></span></p>
                </div>
                <div class="p-1 bg-gray-200 rounded-lg">
                    <p class="text-xs text-gray-500 font-bold" id="durationLabel">DAUER</p>
                    <p class="text-base font-bold text-gray-800"><span id="durationDisplay"></span></p>
                </div>

            <div id="breakEvenTimeContainer" class="p-2 bg-blue-100 rounded-lg text-center">

                <p id="breakEvenTimeDisplay" class="text-sm font-bold text-blue-800"></p>
            </div>

        <div id="fixedPricesContainer" class="hidden"></div>
    </div>

    <div id="infoModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden p-4">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="space-y-4 text-gray-700"></div>
        </div>
    </div>

            const thermeData = {

                    ],

                        'Donnerstag': { start: '09:30', end: '22:00' },

                    }
                },
                bobingen: {

                    ticketPrices: [
                        { duration: 120, price: 26.90, name: '2-Stunden-Karte' },
                        { duration: 240, price: 29.90, name: '4-Stunden-Karte' },

                    ],
                    extensionCost: 0.90,
                    openingHoursData: {

                    }

                musterbad1: {
                    permanentlyClosed: false,
                    ticketPrices: [
                        { duration: 120, price: 10.00, name: '2-Stunden-Karte' },

                    ],
                    extensionCost: 2.50,
                    openingHoursData: {

                        'Montag': { start: '09:00', end: '12:00' },

                        'Mittwoch': null,
                        'Donnerstag': { start: '10:00', end: '22:00' },

                    }
                },
                musterbad2: {
                    permanentlyClosed: false,
                    ticketPrices: [
                        { duration: 120, price: 10.00, name: '2-Stunden-Karte' },
                        { duration: 240, price: 20.00, name: '4-Stunden-Karte' },
                        { duration: Infinity, price: 26.00, name: 'Tageskarte (ab 5,0 h)' }
                    ],
                    extensionCost: 2.50,
                    openingHoursData: {
                        'Sonntag': { start: '10:00', end: '22:00' },
                        'Montag': { start: '10:00', end: '22:00' },
                        'Dienstag': null,
                        'Mittwoch': { start: '10:00', end: '22:00' },
                        'Donnerstag': { start: '10:00', end: '22:00' },
                        'Freitag': { start: '10:00', end: '22:00' },
                        'Samstag': { start: '10:00', end: '22:00' }
                    }
                },
                musterbad3: {
                    permanentlyClosed: false,
                    ticketPrices: [
                        { duration: 120, price: 10.00, name: '2-Stunden-Karte' },
                        { duration: 240, price: 20.00, name: '4-Stunden-Karte' },
                        { duration: Infinity, price: 25.00, name: 'Tageskarte (ab 4,5 h)' }
                    ],
                    extensionCost: 2.50,
                    openingHoursData: {
                        'Sonntag': { start: '10:00', end: '22:00' },
                        'Montag': { start: '10:00', end: '22:00' },
                        'Dienstag': { start: '10:00', end: '22:00' },
                        'Mittwoch': { start: '10:00', end: '22:00' },
                        'Donnerstag': null,
                        'Freitag': { start: '10:00', end: '22:00' },
                        'Samstag': { start: '10:00', end: '22:00' }
                    }
                }
            };

            let currentTherme = thermeData[thermeSelect.value];
            const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
            let lastInteractionType = 'time';

            function getNow() {
                const now = new Date();
                now.setSeconds(0, 0); 
                return now;
            }

            function getNowTimeFormatted() {
                const now = getNow();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            }

            function formatDateShort(d) {
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                return `${day}.${month}.`;
            }

            function getClosingTime(date, hours) {
                const [endHour, endMinute] = hours.end.split(':').map(Number);
                const closingTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), endHour, endMinute);
                if (endHour === 24) {
                    closingTime.setDate(closingTime.getDate() + 1);
                    closingTime.setHours(0, 0, 0, 0);
                }
                return closingTime;
            }

            function findNextOpenDate(fromDate) {
                if (currentTherme.permanentlyClosed) {
                    return null; 
                }

                const checkDate = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
                for (let i = 0; i < 7; i++) {
                    const dayName = days[checkDate.getDay()];
                    const hours = currentTherme.openingHoursData[dayName];
                    if (hours) {
                        return { date: checkDate, hours: hours, dayName: dayName };
                    }
                    checkDate.setDate(checkDate.getDate() + 1);
                }
                return null;
            }

            function displayOpeningHours(date) {
                const dayName = days[date.getDay()];
                const hours = currentTherme.openingHoursData[dayName];
                const now = getNow();

                nextOpeningHoursDisplay.className = "text-center text-sm p-2 rounded-lg font-medium w-full";

                if (!hours || currentTherme.permanentlyClosed) {
                    const tomorrow = new Date(date);
                    tomorrow.setDate(date.getDate() + 1);
                    const nextOpen = currentTherme.permanentlyClosed ? null : findNextOpenDate(tomorrow);

                    nextOpeningHoursDisplay.classList.add("bg-amber-100", "text-amber-900", "border", "border-amber-300");
                    if (nextOpen && !currentTherme.permanentlyClosed) {
                        const dateStr = formatDateShort(nextOpen.date);
                        nextOpeningHoursDisplay.innerHTML = `<span class="inline-block px-1.5 py-0.5 mr-1 bg-red-600 text-white rounded font-bold text-xs uppercase">Ruhetag</span> Nächste Öffnung: <strong>${nextOpen.dayName}, ${dateStr}</strong> ab <strong>${nextOpen.hours.start} Uhr</strong>`;
                    } else {
                        nextOpeningHoursDisplay.innerHTML = "Dauerhaft geschlossen";
                    }
                    return;
                }

                nextOpeningHoursDisplay.classList.add("bg-blue-100", "text-blue-800");

                if (date.toDateString() === now.toDateString()) {
                    const openingTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), ...hours.start.split(':').map(Number));
                    const closingTime = getClosingTime(date, hours);

                    if (now.getTime() < openingTime.getTime()) {
                        nextOpeningHoursDisplay.innerHTML = `Öffnet heute um <strong>${hours.start} Uhr</strong>`;
                    } else if (now.getTime() < closingTime.getTime()) {
                        nextOpeningHoursDisplay.innerHTML = `Heute geöffnet bis <strong>${hours.end.replace('24:00', '00:00')} Uhr</strong>`;
                    } else {
                        const tomorrow = new Date(now);
                        tomorrow.setDate(now.getDate() + 1);
                        const nextOpen = findNextOpenDate(tomorrow);
                        if (nextOpen) {
                            const dateStr = formatDateShort(nextOpen.date);
                            nextOpeningHoursDisplay.innerHTML = `Geschlossen, öffnet am <strong>${nextOpen.dayName}, ${dateStr}</strong> um <strong>${nextOpen.hours.start} Uhr</strong>`;
                        } else {
                            nextOpeningHoursDisplay.innerHTML = "Geschlossen";
                        }
                    }
                } else {
                    const dateStr = formatDateShort(date);
                    nextOpeningHoursDisplay.innerHTML = `Geöffnet <strong>${dayName}, ${dateStr}</strong><br>${hours.start} - ${hours.end.replace('24:00', '00:00')} Uhr`;
                }
            }

            function findBestOption(durationInMinutes) {
                let bestOption = null;
                let minCost = Infinity;
                let allCalculatedCosts = [];
                currentTherme.ticketPrices.forEach(ticket => {
                    let cost = ticket.price;
                    if (durationInMinutes > ticket.duration && ticket.duration !== Infinity) {
                        const extraMinutes = durationInMinutes - ticket.duration;
                        const extensionsNeeded = Math.ceil(extraMinutes / 30); 
                        cost += extensionsNeeded * currentTherme.extensionCost;
                    }
                    allCalculatedCosts.push({ name: ticket.name, cost: cost, duration: ticket.duration });
                    
                    if (cost < minCost || (cost === minCost && ticket.duration > (bestOption ? bestOption.duration : 0))) {
                        minCost = cost;
                        bestOption = { name: ticket.name, duration: ticket.duration, price: ticket.price };
                    }
                });

                allCalculatedCosts.sort((a, b) => a.cost - b.cost);
                let savings = 0;
                let comparedToOption = '';
                
                const higherCostItem = allCalculatedCosts.find(item => item.cost > minCost);
                if (higherCostItem) {
                    savings = higherCostItem.cost - minCost;
                    comparedToOption = higherCostItem.name;
                }

                return { bestOption, calculatedCost: minCost, savings, comparedToOption };
            }

            function getBreakEvenTime(entryTime) {
                const fourHourTicket = currentTherme.ticketPrices.find(t => t.duration === 240);
                const dayPassTicket = currentTherme.ticketPrices.find(t => t.duration === Infinity);
                
                if (!fourHourTicket || !dayPassTicket || fourHourTicket.price >= dayPassTicket.price) {
                    breakEvenTimeContainer.style.display = 'none';
                    return;
                }
                
                breakEvenTimeContainer.style.display = 'block';
                breakEvenLabel.textContent = "Tageskarte rentabel ab";

                const costDifference = dayPassTicket.price - fourHourTicket.price;
                const maxExtensionsCheaper = Math.floor((costDifference - 0.01) / currentTherme.extensionCost);
                const minutesToBreakEven = fourHourTicket.duration + (maxExtensionsCheaper * 30) + 1;

                const dayOfWeek = days[entryTime.getDay()];
                const hours = currentTherme.openingHoursData[dayOfWeek];
                if (!hours) return "Geschlossen";
                
                const openingTime = new Date(entryTime.getFullYear(), entryTime.getMonth(), entryTime.getDate(), ...hours.start.split(':').map(Number));
                const closingTime = getClosingTime(entryTime, hours);
                
                const exactEntry = new Date(entryTime.getTime());
                exactEntry.setSeconds(0, 0);
                const effectiveStartTime = new Date(Math.max(exactEntry.getTime(), openingTime.getTime()));
                
                const minutesAvailableToday = Math.round((closingTime.getTime() - effectiveStartTime.getTime()) / (1000 * 60));

                if (minutesToBreakEven > minutesAvailableToday) {
                    return "Heute nicht";
                }
                
                const breakEvenDate = new Date(effectiveStartTime.getTime() + minutesToBreakEven * 60 * 1000);
                
                let plannedMinutes = 0;
                if (lastInteractionType === 'duration') {
                    const h = parseInt(durationHoursInput.value) || 0;
                    const m = parseInt(durationMinutesInput.value) || 0;
                    plannedMinutes = h * 60 + m;
                } else if (departureTimeInput.value) {
                    const [depH, depM] = departureTimeInput.value.split(':').map(Number);
                    const depDate = new Date(entryTime.getFullYear(), entryTime.getMonth(), entryTime.getDate(), depH, depM);
                    if (depDate.getTime() <= effectiveStartTime.getTime()) depDate.setDate(depDate.getDate() + 1);
                    plannedMinutes = Math.round((depDate.getTime() - effectiveStartTime.getTime()) / (1000 * 60));
                }

                if (plannedMinutes >= minutesToBreakEven) {
                    breakEvenLabel.textContent = "Tageskarte rentabel ab";
                    return `${breakEvenDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;
                }
                
                return `${breakEvenDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;
            }

            function getRecommendationColor(result) {
                 if (result.bestOption.name.includes('2-Stunden')) return 'bg-green-500';
                 if (result.bestOption.name.includes('4-Stunden')) return 'bg-yellow-500';
                 return 'bg-blue-500';
            }
            
            function handleInvalidInput(message) {
                recommendationBox.className = 'p-2 rounded-lg text-white font-medium text-center bg-red-500 min-h-[4rem] flex flex-col justify-center';
                targetDateBadge.classList.add('hidden');
                recommendationText.textContent = message;
                savingsText.innerHTML = '';
                calculatedCostDisplay.textContent = '';
                breakEvenTimeDisplay.textContent = 'N/A';
                durationDisplay.textContent = '';
                tomorrowLabel.classList.add('hidden');
            }

            function updateDateBadge(targetDate, isRuhetagSkipped) {
                const now = getNow();
                if (targetDate.toDateString() !== now.toDateString() || isRuhetagSkipped) {
                    const dName = days[targetDate.getDay()];
                    const dStr = formatDateShort(targetDate);
                    targetDateBadge.textContent = isRuhetagSkipped 
                        ? `Berechnet für ${dName}, ${dStr}`
                        : `Berechnet für ${dName}, ${dStr}`;
                    targetDateBadge.classList.remove('hidden');
                } else {
                    targetDateBadge.classList.add('hidden');
                }
            }

            function calculateAndDisplay() {
                const now = getNow();
                
                const entryTimeValue = entryTimeInput.value;
                const departureTimeValue = departureTimeInput.value;
                const durationHoursValue = durationHoursInput.value;
                const durationMinutesValue = durationMinutesInput.value;

                let effectiveEntryTime = null;
                let effectiveDepartureTime = null;
                let durationInMinutes = 0;
                let adjustedMessage = '';
                
                if (lastInteractionType === 'duration' && (durationHoursValue || durationMinutesValue)) {
                    durationLabel.textContent = 'ABREISEZEIT';
                    const hours = parseInt(durationHoursValue) || 0;
                    const minutes = parseInt(durationMinutesValue) || 0;
                    let plannedDuration = hours * 60 + minutes;

                    if (plannedDuration <= 0) {
                        handleInvalidInput('Dauer muss größer 0 sein.');
                        return;
                    }

                    let baseDate = new Date(now);
                    if (entryTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        baseDate.setHours(entryHour, entryMinute, 0, 0);

                        if (baseDate.getTime() < now.getTime() && (now.getTime() - baseDate.getTime()) > 60000) {
                            baseDate.setDate(baseDate.getDate() + 1);
                        }
                    }

                    const nextOpen = findNextOpenDate(baseDate);
                    if (!nextOpen) {
                        handleInvalidInput("Dauerhaft geschlossen");
                        return;
                    }

                    const dayForCalculation = nextOpen.date;
                    const openingHours = nextOpen.hours;
                    const isRuhetagSkipped = (dayForCalculation.toDateString() !== baseDate.toDateString());

                    updateDateBadge(dayForCalculation, isRuhetagSkipped);

                    const openingTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), ...openingHours.start.split(':').map(Number));
                    const closingTime = getClosingTime(dayForCalculation, openingHours);

                    effectiveEntryTime = new Date(dayForCalculation);
                    if (entryTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        effectiveEntryTime.setHours(entryHour, entryMinute, 0, 0);
                    } else {
                        effectiveEntryTime.setHours(openingTime.getHours(), openingTime.getMinutes(), 0, 0);
                    }

                    if (dayForCalculation.toDateString() === now.toDateString()) {
                        effectiveEntryTime = new Date(Math.max(effectiveEntryTime.getTime(), now.getTime(), openingTime.getTime()));
                    } else {
                        effectiveEntryTime = new Date(Math.max(effectiveEntryTime.getTime(), openingTime.getTime()));
                    }

                    const remainingMinutes = Math.max(0, (closingTime.getTime() - effectiveEntryTime.getTime()) / (1000 * 60));
                    const maxDurationExceeded = plannedDuration > remainingMinutes;

                    durationInMinutes = Math.min(plannedDuration, remainingMinutes);
                    effectiveDepartureTime = new Date(effectiveEntryTime.getTime() + durationInMinutes * 60 * 1000);
                    durationDisplay.textContent = `${effectiveDepartureTime.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;

                    const result = findBestOption(durationInMinutes);

                    recommendationText.textContent = result.bestOption.name;

                    if (maxDurationExceeded) {
                        recommendationBox.className = `p-2 rounded-lg text-white font-medium text-center bg-red-500 min-h-[4rem] flex flex-col justify-center`;
                        savingsText.innerHTML = 'Aufenthaltsdauer an Schließzeit angepasst';
                    } else {
                        let recommendationColor = getRecommendationColor(result);
                        recommendationBox.className = `p-2 rounded-lg text-white font-medium text-center ${recommendationColor} min-h-[4rem] flex flex-col justify-center`;
                        savingsText.innerHTML = (adjustedMessage ? `${adjustedMessage}` : '') + (result.savings > 0
                            ? `Du sparst ${result.savings.toFixed(2).replace('.', ',')} € im Vergleich zur<br>${result.comparedToOption}`
                            : 'Dies ist die günstigste Option<br>&nbsp;');
                    }
                    
                    breakEvenTimeDisplay.textContent = getBreakEvenTime(effectiveEntryTime) || 'Nicht relevant';
                    calculatedCostDisplay.textContent = `${result.calculatedCost.toFixed(2).replace('.', ',')} €`;
                    displayOpeningHours(dayForCalculation);

                } else {
                    durationLabel.textContent = 'DAUER';
                    if (!entryTimeValue && !departureTimeValue) {
                        handleInvalidInput('Bitte eine Zeit oder Dauer eingeben.');
                        return;
                    }

                    let targetDate = new Date(now);

                    if (entryTimeValue && departureTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        targetDate.setHours(entryHour, entryMinute, 0, 0);

                        if (targetDate.getTime() < now.getTime() && (now.getTime() - targetDate.getTime() > 60000)) {
                            targetDate.setDate(targetDate.getDate() + 1);
                        }
                    } else if (departureTimeValue) {
                        const [departureHour, departureMinute] = departureTimeValue.split(':').map(Number);
                        const intendedDeparture = new Date(now.getFullYear(), now.getMonth(), now.getDate(), departureHour, departureMinute);
                        const todayHours = currentTherme.openingHoursData[days[now.getDay()]];

                        if (todayHours) {
                            const todayClosingTime = getClosingTime(now, todayHours);
                            if (now.getTime() >= todayClosingTime.getTime() || (intendedDeparture.getTime() <= now.getTime() && intendedDeparture.getHours() < 6)) {
                                targetDate.setDate(targetDate.getDate() + 1);
                            }
                        } else if (intendedDeparture.getTime() <= now.getTime()) {
                            targetDate.setDate(targetDate.getDate() + 1);
                        }
                    } else {
                        handleInvalidInput('Bitte Kommen und Gehenzeit oder Dauer eingeben.');
                        return;
                    }

                    const nextOpen = findNextOpenDate(targetDate);
                    if (!nextOpen) {
                        handleInvalidInput("Dauerhaft geschlossen");
                        return;
                    }

                    const dayForCalculation = nextOpen.date;
                    const entryDayHours = nextOpen.hours;
                    const isRuhetagSkipped = (dayForCalculation.toDateString() !== targetDate.toDateString());

                    updateDateBadge(dayForCalculation, isRuhetagSkipped);

                    const openingTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), ...entryDayHours.start.split(':').map(Number));
                    const closingTime = getClosingTime(dayForCalculation, entryDayHours);

                    if (entryTimeValue && departureTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        const [departureHour, departureMinute] = departureTimeValue.split(':').map(Number);

                        effectiveEntryTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), entryHour, entryMinute);
                        effectiveDepartureTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), departureHour, departureMinute);

                        if (effectiveDepartureTime.getTime() <= effectiveEntryTime.getTime()) {
                            effectiveDepartureTime.setDate(effectiveDepartureTime.getDate() + 1);
                        }
                    } else if (departureTimeValue) {
                        const [departureHour, departureMinute] = departureTimeValue.split(':').map(Number);

                        effectiveEntryTime = (dayForCalculation.toDateString() === now.toDateString())
                            ? new Date(Math.max(now.getTime(), openingTime.getTime()))
                            : openingTime;

                        effectiveDepartureTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), departureHour, departureMinute);
                        if (effectiveDepartureTime.getTime() <= effectiveEntryTime.getTime()) {
                            effectiveDepartureTime.setDate(effectiveDepartureTime.getDate() + 1);
                        }
                    }

                    if (entryTimeValue) {
                        const inputTimeOnVisitDay = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), ...entryTimeValue.split(':').map(Number));
                        
                        if (inputTimeOnVisitDay.getTime() < openingTime.getTime()) {
                            effectiveEntryTime = openingTime;
                            adjustedMessage += 'Aufenthaltsdauer an Öffnungszeit angepasst<br>';
                        }
                        
                        if (departureTimeValue && effectiveDepartureTime.getTime() > closingTime.getTime()) {
                            effectiveDepartureTime = closingTime;
                            adjustedMessage += `Aufenthaltsdauer an Schließzeit angepasst<br>`;
                        }
                    }
                    
                    durationInMinutes = Math.max(0, (effectiveDepartureTime.getTime() - effectiveEntryTime.getTime()) / (1000 * 60));
                    
                    const result = findBestOption(durationInMinutes);
                    const recommendationColor = getRecommendationColor(result);

                    recommendationText.textContent = result.bestOption.name;

                    if (adjustedMessage) {
                        recommendationBox.className = `p-2 rounded-lg text-white font-medium text-center bg-red-500 min-h-[4rem] flex flex-col justify-center`;
                        savingsText.innerHTML = adjustedMessage.replace(/<br>$/, '');
                    } else {
                        recommendationBox.className = `p-2 rounded-lg text-white font-medium text-center ${recommendationColor} min-h-[4rem] flex flex-col justify-center`;
                        savingsText.innerHTML = result.savings > 0
                            ? `Du sparst ${result.savings.toFixed(2).replace('.', ',')} € im Vergleich zur<br>${result.comparedToOption}`
                            : 'Dies ist die günstigste Option<br>&nbsp;';
                    }

                    calculatedCostDisplay.textContent = `${result.calculatedCost.toFixed(2).replace('.', ',')} €`;
                    durationDisplay.textContent = `${Math.floor(durationInMinutes / 60)}h ${Math.floor(durationInMinutes % 60)}min`;
                    breakEvenTimeDisplay.textContent = getBreakEvenTime(effectiveEntryTime) || 'Nicht relevant';
                    displayOpeningHours(dayForCalculation);
                }

                if (effectiveEntryTime && effectiveDepartureTime) {
                    const entryDay = new Date(effectiveEntryTime);
                    entryDay.setHours(0, 0, 0, 0);
                    const departureDay = new Date(effectiveDepartureTime);
                    departureDay.setHours(0, 0, 0, 0);
                    
                    if (entryDay.getTime() !== departureDay.getTime()) {
                         tomorrowLabel.classList.remove('hidden');
                    } else {
                         tomorrowLabel.classList.add('hidden');
                    }
                } else {
                     tomorrowLabel.classList.add('hidden');
                }
            }
            
            function handleInput(event) {
                const targetId = event.target.id;

                if (targetId === 'entryTime') {
                    if (!durationHoursInput.value && !durationMinutesInput.value) {
                        lastInteractionType = 'time';
                    }
                } else if (targetId === 'departureTime') {
                    lastInteractionType = 'time';
                    durationHoursInput.value = '';
                    durationMinutesInput.value = '';
                } else if (targetId === 'durationHours' || targetId === 'durationMinutes') {
                    lastInteractionType = 'duration';
                    departureTimeInput.value = '';
                }
                
                calculateAndDisplay();
            }

            function initializeUI() {
                currentTherme = thermeData[thermeSelect.value];

                const now = getNow();
                let nextOpen = currentTherme.permanentlyClosed ? null : findNextOpenDate(now);

                if (!nextOpen) {
                    nextOpen = {
                        date: now,
                        hours: { start: '09:00', end: '22:00' },
                        dayName: days[now.getDay()]
                    };
                }

                let effectiveStartTime = nextOpen.hours.start;
                const [openHour, openMinute] = nextOpen.hours.start.split(':').map(Number);
                const openingTimeDate = new Date(nextOpen.date.getFullYear(), nextOpen.date.getMonth(), nextOpen.date.getDate(), openHour, openMinute, 0, 0);
                const closingTimeDate = getClosingTime(nextOpen.date, nextOpen.hours);

                if (nextOpen.date.toDateString() === now.toDateString() && !currentTherme.permanentlyClosed) {
                    if (now.getTime() >= closingTimeDate.getTime()) {
                        const tomorrow = new Date(now);
                        tomorrow.setDate(now.getDate() + 1);
                        const futureOpen = findNextOpenDate(tomorrow);
                        if (futureOpen) {
                            nextOpen = futureOpen;
                            effectiveStartTime = futureOpen.hours.start;
                        }
                    } else if (now.getTime() > openingTimeDate.getTime()) {
                        effectiveStartTime = getNowTimeFormatted();
                    }
                }
                
                if (!entryTimeInput.value) {
                    entryTimeInput.value = effectiveStartTime;
                }
                
                if (lastInteractionType === 'time') {
                    if (!departureTimeInput.value) {
                        departureTimeInput.value = '19:00';
                    }
                } else {
                    departureTimeInput.value = ''; 
                }

                displayOpeningHours(nextOpen.date);
                calculateAndDisplay();
            }

            function openInfoModal() {
                const selectedTherme = thermeSelect.value;
                const thermeName = thermeSelect.options[thermeSelect.selectedIndex].text;
                const data = thermeData[selectedTherme];

                modalTitle.textContent = thermeName;
                const sortedDays = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

                let contentHtml = '<p class="text-sm font-semibold mb-2 text-gray-800">Öffnungszeiten:</p>';
                contentHtml += '<table class="w-full text-left border-collapse">';
                
                sortedDays.forEach(day => {
                    const hours = data.openingHoursData[day];
                    contentHtml += `<tr class="border-t border-gray-200">
                        <td class="py-1 px-1">${day}</td>
                        <td class="py-1 px-1 text-right font-medium">${hours && !data.permanentlyClosed ? `${hours.start} - ${hours.end.replace('24:00', '00:00')} Uhr` : '<span class="text-red-500 font-semibold">Geschlossen</span>'}</td>
                    </tr>`;
                });
                
                contentHtml += '</table>';
                contentHtml += '<p class="text-sm font-semibold mt-4 mb-2 text-gray-800">Preise:</p>';
                contentHtml += '<table class="w-full text-left border-collapse">';
                data.ticketPrices.forEach(ticket => {
                    contentHtml += `<tr class="border-t border-gray-200"><td class="py-1 px-1">${ticket.name}</td><td class="py-1 px-1 text-right font-medium">${ticket.price.toFixed(2).replace('.', ',')} €</td></tr>`;
                });
                contentHtml += `<tr class="border-t border-gray-200"><td class="py-1 px-1">Verlängerung 30 min.</td><td class="py-1 px-1 text-right font-medium">${data.extensionCost.toFixed(2).replace('.', ',')} €</td></tr>`;
                contentHtml += '</table>';

                modalContent.innerHTML = contentHtml;
                infoModal.classList.remove('hidden');
            }

            initializeUI();

            function startUpdateInterval() {
                setInterval(() => {
                    if (!document.activeElement.matches('input[type="time"], input[type="number"], select')) {
                        calculateAndDisplay(); 
                    }
                }, 10000);
            }

            startUpdateInterval();

            thermeSelect.addEventListener('change', initializeUI);
            entryTimeInput.addEventListener('input', handleInput);
            departureTimeInput.addEventListener('input', handleInput);
            durationHoursInput.addEventListener('input', handleInput);
            durationMinutesInput.addEventListener('input', handleInput);
            
            infoButton.addEventListener('click', openInfoModal);
            closeModalButton.addEventListener('click', () => {
                infoModal.classList.add('hidden');
            });
            window.addEventListener('click', (event) => {
                if (event.target === infoModal) {
                    infoModal.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
